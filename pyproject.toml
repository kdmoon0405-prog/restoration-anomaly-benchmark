[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-anomaly-research"
version = "0.1.0"
description = "CPU-safe framework for restoration and anomaly-detection experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "scikit-image>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
lpips = ["torch>=2.0", "lpips>=0.1.4"]
pilot = ["anomalib[cpu]==2.6.2"]
legacy = ["torch>=2.0", "torchvision>=0.15", "timm>=0.6", "faiss-cpu>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
